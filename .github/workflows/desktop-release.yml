name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            name: macOS Apple Silicon
            os: macos-latest
            arch: arm64
          - id: macos-x64
            name: macOS Intel
            os: macos-latest
            arch: x64
          - id: windows-x64
            name: Windows x64
            os: windows-latest
            arch: x64
          - id: linux-x64
            name: Linux x64
            os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: masscode-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masscode-runner/package-lock.json
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
      - run: npm ci
      - run: npm test
      - run: npm run make:desktop -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: codescope-${{ matrix.id }}
          path: masscode-runner/out/make/**/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "CodeScope $TAG_NAME" --generate-notes
          find desktop-artifacts -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber
