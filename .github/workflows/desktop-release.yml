name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: masscode-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masscode-runner/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run make:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: codescope-${{ runner.os }}-${{ runner.arch }}
          path: masscode-runner/out/make/**/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: desktop-artifacts
      - name: Attach installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "CodeScope $TAG_NAME" --generate-notes
          find desktop-artifacts -type f -print0 | xargs -0 gh release upload "$TAG_NAME" --clobber
