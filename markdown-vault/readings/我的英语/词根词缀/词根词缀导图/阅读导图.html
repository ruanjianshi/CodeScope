<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词根词缀 · 六级完整版</title>
  <style>
    :root {
      --bg: #080c12;
      --border: #1e2936;
      --text: #e6edf3;
      --muted: #7d8fa5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: radial-gradient(1200px 600px at 15% -10%, #0f1b2e 0%, transparent 55%),
        radial-gradient(1000px 500px at 90% 110%, #1a0f2e 0%, transparent 50%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      flex: none;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 12, 18, .85);
      backdrop-filter: blur(12px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #4ea1ff, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .brand h1 {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
    }

    .brand p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
    }

    .search-wrap {
      flex: 1;
      max-width: 280px;
      position: relative;
      margin-left: auto;
    }

    .search-wrap .icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: .5;
      pointer-events: none;
    }

    .search {
      width: 100%;
      padding: 7px 12px 7px 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0e141d;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: .2s;
      font-family: inherit;
    }

    .search::placeholder {
      color: #4a5768;
    }

    .search:focus {
      border-color: #4ea1ff;
      box-shadow: 0 0 0 3px rgba(78, 161, 255, .12);
    }

    .btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0e141d;
      color: var(--muted);
      cursor: pointer;
      font-size: 12.5px;
      font-family: inherit;
      transition: .15s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn:hover {
      border-color: #3d5170;
      color: #fff;
      background: #131b27;
    }

    .btn.primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }

    .btn.primary:hover {
      filter: brightness(1.15);
    }

    .btn.gold {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      border-color: transparent;
      font-weight: 600;
    }

    .btn.gold:hover {
      filter: brightness(1.15);
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
    }

    #svg.dragging {
      cursor: grabbing;
    }

    .node {
      cursor: pointer;
    }

    .node rect {
      transition: filter .15s;
    }

    .node:hover rect {
      filter: brightness(1.35);
    }

    .node.dim {
      opacity: .15;
      pointer-events: none;
    }

    .node.match rect {
      stroke-width: 2.5 !important;
      filter: drop-shadow(0 0 12px currentColor);
    }

    .link {
      fill: none;
      transition: opacity .2s;
    }

    .link.dim {
      opacity: .04;
    }

    .detail {
      position: absolute;
      left: 18px;
      bottom: 18px;
      width: 440px;
      max-height: calc(100% - 100px);
      padding: 0;
      border-radius: 14px;
      background: rgba(14, 20, 30, .96);
      border: 1px solid #26303f;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px -20px #000;
      display: none;
      animation: fadeUp .22s ease;
      overflow: hidden;
    }

    .detail.show {
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail .tip-bar {
      padding: 9px 16px;
      background: linear-gradient(90deg, rgba(78, 161, 255, .12), rgba(167, 139, 250, .08));
      border-bottom: 1px solid rgba(78, 161, 255, .15);
      font-size: 11.5px;
      color: #9ecbff;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    .detail .tip-bar b {
      color: #4ea1ff;
      font-weight: 700;
    }

    .detail .body {
      padding: 16px 20px;
      overflow-y: auto;
    }

    .detail .close {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: rgba(14, 20, 30, .9);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      z-index: 2;
    }

    .detail .close:hover {
      color: #fff;
      border-color: #ff5f6d;
    }

    .detail .dtag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: .3px;
    }

    .src-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 10.5px;
      font-weight: 700;
      margin-left: 8px;
      letter-spacing: .3px;
      vertical-align: middle;
    }

    .src-badge.latin {
      background: rgba(251, 146, 60, .15);
      color: #fdba74;
      border: 1px solid rgba(251, 146, 60, .25);
    }

    .src-badge.greek {
      background: rgba(34, 211, 238, .15);
      color: #67e8f9;
      border: 1px solid rgba(34, 211, 238, .25);
    }

    .detail h3 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .3px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .detail h3 .h3-left {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .detail h3 .h3-pron {
      font-size: 14px;
      color: #a78bfa;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .4px;
      white-space: nowrap;
      margin-left: auto;
    }

    .detail .mean {
      font-size: 14px;
      color: #fbbf24;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .origin-box {
      margin: 10px 0;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(78, 161, 255, .06);
      border: 1px solid rgba(78, 161, 255, .15);
    }

    .origin-box .origin-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #4ea1ff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .origin-box .origin-label::before {
      content: '📜';
      font-size: 13px;
    }

    .origin-box .origin-text {
      font-size: 12.5px;
      line-height: 1.7;
      color: #b8c9db;
    }

    .origin-box .origin-latin {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #93c5fd;
      font-weight: 600;
      background: rgba(78, 161, 255, .1);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .compare-box {
      margin: 10px 0;
      padding: 11px 14px;
      border-radius: 10px;
      background: rgba(251, 191, 36, .06);
      border: 1px solid rgba(251, 191, 36, .18);
    }

    .compare-box .compare-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .compare-box .compare-label::before {
      content: '⚖️';
      font-size: 13px;
    }

    .compare-box .compare-text {
      font-size: 12.5px;
      line-height: 1.7;
      color: #d4c5a0;
    }

    .compare-box .compare-text b {
      color: #fcd34d;
    }

    .ex-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .ex-item {
      padding: 9px 12px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .025);
      border-left: 2px solid rgba(78, 161, 255, .4);
    }

    .ex-item .ex-w {
      color: #93c5fd;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .3px;
      margin-bottom: 5px;
    }

    .ex-item .ex-b {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
      color: #5eead4;
      margin-bottom: 5px;
      line-height: 1.5;
      letter-spacing: .2px;
    }

    .ex-item .ex-b .plus {
      color: #4a5768;
      margin: 0 3px;
    }

    .ex-item .ex-m {
      font-size: 12.5px;
      color: #b8c9db;
      line-height: 1.6;
    }

    .ex-item .ex-m .arrow {
      color: #fbbf24;
      margin: 0 4px;
      font-weight: 700;
    }

    .mastery-btns {
      display: flex;
      gap: 6px;
      margin: 10px 0 4px;
    }

    .mbtn {
      flex: 1;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0e141d;
      color: var(--muted);
      cursor: pointer;
      font-size: 11.5px;
      font-family: inherit;
      transition: .15s;
    }

    .mbtn:hover {
      border-color: #3d5170;
      color: #fff;
    }

    .mbtn.active-1 {
      background: rgba(251, 191, 36, .15);
      border-color: #fbbf24;
      color: #fcd34d;
      font-weight: 600;
    }

    .mbtn.active-2 {
      background: rgba(61, 220, 132, .15);
      border-color: #3ddc84;
      color: #3ddc84;
      font-weight: 600;
    }

    .zoom-ctrl {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .zbtn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(14, 20, 30, .9);
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .15s;
      backdrop-filter: blur(10px);
      font-family: inherit;
    }

    .zbtn:hover {
      border-color: #4ea1ff;
      color: #fff;
      background: #131b27;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 8, 13, .82);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
      animation: fade .18s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow: auto;
      background: linear-gradient(180deg, #161e2b, #111721);
      border: 1px solid #2c3a4f;
      border-radius: 18px;
      padding: 20px 22px 26px;
      box-shadow: 0 30px 80px -30px #000;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    #quizProgress {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: .5px;
    }

    .close-m {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .close-m:hover {
      color: #fff;
      border-color: #ff5f6d;
    }

    .q-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
      text-align: center;
    }

    .q-root {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 28px;
      font-weight: 800;
      color: #4ea1ff;
      text-align: center;
      padding: 16px 0 6px;
      letter-spacing: 1px;
    }

    .q-pron {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: #a78bfa;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: .5px;
    }

    .q-hint {
      font-size: 12px;
      color: #7d8fa5;
      text-align: center;
      margin-bottom: 14px;
    }

    .options {
      display: grid;
      gap: 9px;
    }

    .opt {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: #141b26;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      text-align: left;
      transition: .15s;
      font-family: inherit;
    }

    .opt:hover:not(:disabled) {
      border-color: #4ea1ff;
      background: #182233;
    }

    .opt:disabled {
      cursor: default;
      opacity: .75;
    }

    .opt.right {
      background: rgba(61, 220, 132, .14);
      border-color: #3ddc84;
      color: #3ddc84;
      opacity: 1;
      font-weight: 600;
    }

    .opt.wrong {
      background: rgba(255, 95, 109, .13);
      border-color: #ff5f6d;
      color: #ff5f6d;
      opacity: 1;
    }

    .fb {
      margin-top: 16px;
      font-size: 13.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 36px;
    }

    .next-btn {
      margin-left: auto;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
    }

    .next-btn:hover {
      filter: brightness(1.12);
    }

    .result {
      text-align: center;
      padding: 20px 0 6px;
    }

    .result .big {
      font-size: 46px;
      font-weight: 800;
      color: #4ea1ff;
      font-family: ui-monospace, monospace;
    }

    .result .pct {
      color: #fbbf24;
      font-size: 16px;
      margin: 6px 0 14px;
    }

    .result p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 22px;
      line-height: 1.6;
    }

    .result .next-btn {
      margin: 0 6px;
    }

    .ghost-btn {
      padding: 9px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13.5px;
      font-family: inherit;
    }

    .ghost-btn:hover {
      color: #fff;
      border-color: #4a5c78;
    }

    @media(max-width:800px) {
      .brand p {
        display: none;
      }

      .detail {
        width: calc(100% - 36px);
        left: 18px;
        right: 18px;
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🧠</div>
      <div>
        <h1>词根词缀 · 六级完整版</h1>
        <p>音标在标题右侧 · 例词展示拆解</p>
      </div>
    </div>
    <div class="search-wrap">
      <span class="icon">🔍</span>
      <input class="search" id="search" placeholder="搜索词根 / 含义 / 例词…">
    </div>
    <button class="btn gold" id="quizBtn">🎯 随机自测</button>
    <button class="btn" id="expandBtn">展开全部</button>
    <button class="btn" id="collapseBtn">折叠</button>
    <button class="btn primary" id="fitBtn">适应屏幕</button>
  </div>

  <div class="canvas-wrap">
    <svg id="svg">
      <g id="viewport">
        <g id="links"></g>
        <g id="nodes"></g>
      </g>
    </svg>
    <div class="detail" id="detail"></div>
    <div class="zoom-ctrl">
      <button class="zbtn" id="zoomIn">+</button>
      <button class="zbtn" id="zoomOut">−</button>
      <button class="zbtn" id="zoomFit">⛶</button>
    </div>
  </div>

  <div class="modal" id="quizModal">
    <div class="modal-box">
      <div class="modal-head">
        <span id="quizProgress">1 / 10</span>
        <button class="close-m" id="closeQuiz">✕</button>
      </div>
      <div id="quizBody"></div>
    </div>
  </div>

  <script>
    /* ============================================================
   数据（例词格式：[单词, 含义演变, 拆解]）
   ============================================================ */
const DATA = {
  root: [
    { group:'看与感知', items:[
      {k:'vis / vid', m:'看', pron:'/vɪs/ · /vɪd/', origin:'源自拉丁语 <span class="origin-latin">videre</span>（看），词干 <span class="origin-latin">vid-</span> 在分词时音变为 <span class="origin-latin">visum</span>（d 脱落），故有 <span class="origin-latin">vis-</span> 变体。两者同源，都表示“看”。', e:[
        ['visit', '去看 → 拜访', 'vis(看) + it(走)'],
        ['visible', '能被看见的 → 可见的', 'vis(看) + ible(能…的)'],
        ['vision', '看见之物 → 视野、愿景', 'vis(看) + ion(名词后缀)'],
        ['supervise', '在上面看 → 监督', 'super(在上面) + vis(看) + e'],
        ['invisible', '看不见的 → 无形的', 'in(否定) + vis(看) + ible(能…的)']
      ]},
      {k:'spect / spic', m:'看', pron:'/spekt/ · /spɪk/', origin:'源自拉丁语 <span class="origin-latin">specere</span>（注视）。<span class="origin-latin">spect</span> 是分词词干，<span class="origin-latin">spic</span> 是变体。比 vis 更强调“注视、观察”的动作过程。', e:[
        ['inspect', '向里看 → 检查', 'in(向里) + spect(看)'],
        ['respect', '反复看 → 尊重', 're(反复) + spect(看)'],
        ['perspective', '穿透看 → 视角', 'per(穿过) + spect(看) + ive(形容词后缀)'],
        ['spectator', '看的人 → 观众', 'spect(看) + ator(做…的人)'],
        ['suspect', '在下面看 → 怀疑', 'su(在下面) + spect(看)'],
        ['prospect', '向前看 → 前景', 'pro(向前) + spect(看)'],
        ['spectacle', '看的东西 → 景象', 'spect(看) + acle(名词后缀)']
      ]},
      {k:'sci', m:'知道', pron:'/saɪ/', origin:'源自拉丁语 <span class="origin-latin">scire</span>（知道）。本义是“通过询问而得知”。从“知道”引申出“科学”science，即系统化的“知道”。', e:[
        ['science', '知道 → 科学', 'sci(知道) + ence(名词后缀)'],
        ['conscious', '共同知道 → 有意识的', 'con(共同) + sci(知道) + ous(形容词后缀)'],
        ['conscience', '共同知道 → 良心', 'con(共同) + sci(知道) + ence(名词后缀)']
      ]},
      {k:'sent / sens', m:'感觉', pron:'/sent/ · /sens/', origin:'源自拉丁语 <span class="origin-latin">sentire</span>（感觉）。sent 是动词词干，sens 是分词词干。由“感觉”引申出“同意”（consent = 共同感觉 → 意见一致）。', e:[
        ['sense', '感觉 → 感觉', 'sens(感觉) + e'],

const GREEK_MARKERS = ['bio','geo','tele','phon','graph','log','meter','metr','chron','therm','astr','auto','mono','poly','micro','macro','hyper','hypo','syn','sym','dia','para','meta','peri','epi','phob','psych'];

function isGreekRoot(key){
  const k = key.toLowerCase();
  return GREEK_MARKERS.some(m => k.includes(m));
}

const COMPARE_PAIRS = [
  { roots:['vis / vid','spect / spic'], title:'都表示“看”，区别在哪？', text:'<b>vis</b> 强调“看见的结果”（visible = 能被看见的）；<b>spect</b> 强调“注视的动作过程”（inspect = 向里看，检查）。' },
  { roots:['cred','fid'], title:'都表示“相信”', text:'<b>cred</b> 偏“相信其真实性”（credible = 可信的）；<b>fid</b> 偏“依赖、忠诚的情感”（confide = 完全信任，倾诉）。' },
  { roots:['port','fer'], title:'都与“搬运”相关', text:'<b>port</b> 偏“运输、搬运”（transport 运输）；<b>fer</b> 偏“携带、承受”（offer 提供，prefer 更喜欢）。' },

  { roots:['sci','sent / sens'], title:'“知道”与“感觉”', text:'<b>sci</b> 是认知层面的“知道”（science 科学）；<b>sent</b> 是感官层面的“感觉”（sense 感觉）。从感知到认知，是这一组词根的递进逻辑。' },

];

function findCompare(rootKey){
  return COMPARE_PAIRS.find(p => p.roots.includes(rootKey));
}

/* ============================================================
   构建树
   ============================================================ */
const CATEGORIES = [
  { key:'root',   label:'词根', sub:'语义内核', color:'teal'   },
  { key:'prefix', label:'前缀', sub:'改变含义', color:'purple' },
  { key:'suffix', label:'后缀', sub:'改变词性', color:'amber'  }
];

function buildTree(){
  const root = {
    id:'root', type:'root', color:'root',
    label:'英语单词', sub:'底层粒子',
    collapsed:false, children:[]
  };

  CATEGORIES.forEach(cat => {
    const catNode = {
      id:'cat-'+cat.key, type:'cat', color:cat.color,
      label:cat.label, sub:cat.sub,
      collapsed:true, children:[]
    };

    DATA[cat.key].forEach((g, gi) => {
      const groupNode = {
        id:`grp-${cat.key}-${gi}`, type:'group', color:cat.color,
        label:g.group, sub:`${g.items.length} 项`,
        collapsed:true, children:[]
      };

      g.items.forEach((item, ii) => {
        const src = cat.key === 'root' ? (isGreekRoot(item.k) ? 'greek' : 'latin') : 'latin';

        const itemNode = {
          id:`itm-${cat.key}-${gi}-${ii}`, type:'item', color:cat.color,
          label:item.k, sub:item.m,
          origin: item.origin || '',
          pron: item.pron || '',
          src: src,
          collapsed:true, children:[]
        };

        item.e.forEach((ex, ei) => {
          itemNode.children.push({
            id:`ex-${cat.key}-${gi}-${ii}-${ei}`,
            type:'ex', color:cat.color,
            label:ex[0],
            sub:ex[1],
            breakdown: ex[2] || ''
          });
        });

        groupNode.children.push(itemNode);
      });

      catNode.children.push(groupNode);
    });

    root.children.push(catNode);
  });

  return root;
}

const TREE = buildTree();

/* ============================================================
   尺寸、颜色、布局
   ============================================================ */
const SIZES = {
  root:  { w: 210, h: 70 },
  cat:   { w: 130, h: 58 },
  group: { w: 160, h: 46 },
  item:  { w: 190, h: 52 },
  ex:    { w: 290, h: 36 }
};
const COL_X = (() => {
  let x = 0;
  return ['root','cat','group','item','ex'].map(t => {
    const cur = x;
    x += SIZES[t].w + 55;
    return cur;
  });
})();
const V_GAP = 8;

const COLORS = {
  root:  { bg:'#0e1a2b', bd:'#3b82f6', t1:'#e0f0ff', t2:'#7ea6d8', line:'#3b82f6' },
  teal:  { bg:'#0a1a1a', bd:'#14b8a6', t1:'#99f6e4', t2:'#5eead4', line:'#14b8a6' },
  purple:{ bg:'#170f2a', bd:'#8b5cf6', t1:'#ddd6fe', t2:'#a78bfa', line:'#8b5cf6' },
  amber: { bg:'#1e1408', bd:'#f59e0b', t1:'#fde68a', t2:'#fbbf24', line:'#f59e0b' }
};

function calcSubtreeH(node){
  node.w = SIZES[node.type].w;
  node.h = SIZES[node.type].h;
  const kids = (node.collapsed || !node.children) ? [] : node.children;
  if (!kids.length){ node.subtreeH = node.h; return node.subtreeH; }
  let total = 0;
  kids.forEach((c, i) => { if (i>0) total += V_GAP; total += calcSubtreeH(c); });
  node.subtreeH = Math.max(node.h, total);
  return node.subtreeH;
}

function assignPos(node, x, y){
  node.x = x;
  node.y = y + (node.subtreeH - node.h) / 2;
  const kids = (node.collapsed || !node.children) ? [] : node.children;
  if (!kids.length) return;
  const childX = COL_X[node.depth + 1];
  let cy = y;
  kids.forEach((c, i) => {
    if (i>0) cy += V_GAP;
    assignPos(c, childX, cy);
    cy += c.subtreeH;
  });
}

function layoutTree(){
  calcSubtreeH(TREE);
  (function ad(n, d){
    n.depth = d;
    if (!n.collapsed && n.children) n.children.forEach(c => ad(c, d+1));
  })(TREE, 0);
  assignPos(TREE, COL_X[0], 0);
}

function collectVisible(node){
  visibleNodes.push(node);
  if (!node.collapsed && node.children){
    node.children.forEach(c => {
      visibleLinks.push({ from:node, to:c });
      collectVisible(c);
    });
  }

function render(){
  layoutTree();
  visibleNodes = []; visibleLinks = [];
  collectVisible(TREE);

  const matchSet = new Set();
  if (query){
    const q = query.toLowerCase();
    const direct = new Set();
    visibleNodes.forEach(n => {
      const hay = (n.label + ' ' + (n.sub || '') + ' ' + (n.origin || '') + ' ' + (n.pron || '') + ' ' + (n.breakdown || '')).toLowerCase();
      if (hay.includes(q)) direct.add(n.id);
    });
    const parentMap = new Map();
    (function map(n){
      if (n.children) n.children.forEach(c => { parentMap.set(c.id, n); map(c); });
    })(TREE);
    direct.forEach(id => {
      matchSet.add(id);
      let p = parentMap.get(id);
      while (p){ matchSet.add(p.id); p = parentMap.get(p); }
    });
  }

  let linkHTML = '';
  visibleLinks.forEach(l => {
    const p = l.from, c = l.to;
    const x1 = p.x + p.w, y1 = p.y + p.h/2;
    const x2 = c.x,       y2 = c.y + c.h/2;
    const dx = Math.max((x2 - x1) * 0.5, 24);
    const d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`;
    const col = COLORS[c.color] || COLORS.root;
    const isDim = query && !matchSet.has(c.id);
    const w = c.type === 'ex' ? 1.2 : (c.type === 'item' ? 1.8 : 2.4);
    linkHTML += `<path class="link${isDim?' dim':''}" d="${d}" stroke="${col.line}" stroke-width="${w}" stroke-linecap="round" opacity="${isDim?0.04:0.35}"/>`;

  gLinks.innerHTML = linkHTML;

  let nodeHTML = '';
  visibleNodes.forEach(n => {
    const col = COLORS[n.color] || COLORS.root;
    const isDim   = query && !matchSet.has(n.id);
    const isMatch = query && matchSet.has(n.id);
    const isSel   = selectedId === n.id;
    const mState  = mastery.get(n.id) || 0;

    let cls = 'node';
    if (isDim) cls += ' dim';
    if (isMatch && query) cls += ' match';

    const r = n.type === 'root' ? 18

    const strokeW = isSel ? 2.2 : 1.4;

    const cx = n.x + n.w/2, cy = n.y + n.h/2;

    if (n.type === 'root'){
      nodeHTML += `<text x="${cx}" y="${cy-5}" text-anchor="middle" fill="${col.t1}" font-size="18" font-weight="800" font-family="inherit">${n.label}</text>`;
      nodeHTML += `<text x="${cx}" y="${cy+16}" text-anchor="middle" fill="${col.t2}" font-size="12" font-family="inherit">${n.sub}</text>`;
    } else if (n.type === 'cat'){
      nodeHTML += `<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="${col.t1}" font-size="17" font-weight="800" font-family="inherit">${n.label}</text>`;
      nodeHTML += `<text x="${cx}" y="${cy+15}" text-anchor="middle" fill="${col.t2}" font-size="11" font-family="inherit">${n.sub}</text>`;
    } else if (n.type === 'group'){
      nodeHTML += `<text x="${cx}" y="${cy+1}" text-anchor="middle" fill="${col.t1}" font-size="13.5" font-weight="700" font-family="inherit">${n.label}</text>`;
      nodeHTML += `<text x="${cx}" y="${cy+17}" text-anchor="middle" fill="${col.t2}" font-size="10.5" font-family="inherit">${n.sub}</text>`;
    } else if (n.type === 'item'){
      nodeHTML += `<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="${col.t1}" font-size="14" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">${n.label}</text>`;
      nodeHTML += `<text x="${cx}" y="${cy+15}" text-anchor="middle" fill="${col.t2}" font-size="11" font-family="inherit">${n.sub}</text>`;
    } else {
      nodeHTML += `<text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12.5" font-family="inherit">`;

/* ============================================================
   视图
   ============================================================ */
function applyViewport(){
  viewport.setAttribute('transform', `translate(${vx},${vy}) scale(${vk})`);
}

function getBounds(){
  if (!visibleNodes.length) return { minX:0, minY:0, maxX:100, maxY:100 };
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  visibleNodes.forEach(n => {
    if (n.x<minX) minX=n.x;
    if (n.y<minY) minY=n.y;
    if (n.x+n.w>maxX) maxX=n.x+n.w;
    if (n.y+n.h>maxY) maxY=n.y+n.h;
  });
  return { minX, minY, maxX, maxY };
}

function fitView(){
  const rect = svg.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const b = getBounds();
  const pad = 80;
  const cw = Math.max(rect.width - pad*2, 150);
  const ch = Math.max(rect.height - pad*2, 150);
  const w = Math.max(b.maxX - b.minX, 1);
  const h = Math.max(b.maxY - b.minY, 1);
  let k = Math.min(cw/w, ch/h);
  k = Math.max(0.08, Math.min(k, 1.4));
  const cxw = (b.minX+b.maxX)/2, cyw = (b.minY+b.maxY)/2;
  vk = k;
  vx = rect.width/2 - cxw*k;
  vy = rect.height/2 - cyw*k;
  applyViewport();
}

function zoomAt(px, py, factor){
  const k2 = Math.max(0.08, Math.min(3.5, vk*factor));
  const s = k2/vk;
  vx = px - (px - vx)*s;
  vy = py - (py - vy)*s;
  vk = k2;
  applyViewport();
}

function findNode(node, id){
  if (node.id === id) return node;
  if (node.children) for (const c of node.children){ const r = findNode(c,id); if (r) return r; }
  return null;
}

function collapseDescendants(node){
  if (!node.children) return;
  node.children.forEach(c => { c.collapsed = true; collapseDescendants(c); });
}

/* ============================================================
   交互
   ============================================================ */
gNodes.addEventListener('click', e => {
  const g = e.target.closest('.node');
  if (!g) return;
  const id = g.dataset.id;
  const node = findNode(TREE, id);
  if (!node) return;

  if (node.children && node.children.length){
    node.collapsed = !node.collapsed;
    if (node.collapsed) collapseDescendants(node);
    selectedId = id;
    render();
    showDetail(node);
    if (!node.collapsed) requestAnimationFrame(() => fitView());
  } else {
    selectedId = (selectedId === id) ? null : id;
    render();
    selectedId ? showDetail(node) : hideDetail();
  }
});

gNodes.addEventListener('contextmenu', e => {
  const g = e.target.closest('.node');
  if (!g) return;
  e.preventDefault();
  const id = g.dataset.id;
  const cur = mastery.get(id) || 0;
  const next = (cur + 1) % 3;
  if (next === 0) mastery.delete(id); else mastery.set(id, next);
  saveMastery();
  render();
  const node = findNode(TREE, id);
  if (node && selectedId === id) showDetail(node);
});

let dragging = false, dragStart = null;
svg.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (e.target.closest('.node')) return;
  dragging = true;
  dragStart = { x:e.clientX, y:e.clientY, vx, vy };
  svg.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  vx = dragStart.vx + (e.clientX - dragStart.x);
  vy = dragStart.vy + (e.clientY - dragStart.y);
  applyViewport();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  svg.classList.remove('dragging');
});

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  zoomAt(e.clientX-rect.left, e.clientY-rect.top, e.deltaY<0?1.12:1/1.12);
}, { passive:false });

let tDist = 0;
svg.addEventListener('touchstart', e => {
  if (e.touches.length === 1){
    dragging = true;
    dragStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, vx, vy };
  } else if (e.touches.length === 2){
    dragging = false;
    tDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
}, { passive:true });
svg.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && dragging){
    e.preventDefault();
    vx = dragStart.vx + (e.touches[0].clientX - dragStart.x);
    vy = dragStart.vy + (e.touches[0].clientY - dragStart.y);
    applyViewport();
  } else if (e.touches.length === 2){
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (tDist > 0){
      const rect = svg.getBoundingClientRect();
      const mx = (e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
      const my = (e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
      zoomAt(mx, my, d/tDist);
    }
    tDist = d;
  }
}, { passive:false });
svg.addEventListener('touchend', () => { dragging = false; tDist = 0; });

/* ============================================================
   详情卡
   ============================================================ */
const CAT_LABEL = { root:'词根', prefix:'前缀', suffix:'后缀' };
const CAT_COLOR = {
  teal:   { bg:'rgba(20,184,166,.15)', color:'#5eead4' },
  purple: { bg:'rgba(139,92,246,.15)', color:'#c4b5fd' },
  amber:  { bg:'rgba(245,158,11,.15)', color:'#fcd34d' },
  root:   { bg:'rgba(59,130,246,.15)', color:'#93c5fd' }
};

function formatBreakdown(b){
  if (!b) return '';
  return b.replace(/\+/g, '<span class="plus">+</span>');
}

function formatMeaning(m){
  if (!m) return '';
  return m.replace(/→/g, '<span class="arrow">→</span>');
}

function showDetail(node){
  const cc = CAT_COLOR[node.color] || CAT_COLOR.root;

  let tipHTML = '';
  if (node.type === 'item'){
    tipHTML = `<div class="tip-bar">💡 <b>心法</b>：先看拆解，再理解演变，最后才记含义</div>`;
  }

  let html = `${tipHTML}<div class="body"><button class="close" id="closeD">✕</button>`;

  if (node.type === 'ex'){
    html += `
      <div class="dtag" style="background:${cc.bg};color:${cc.color}">例词</div>
      <h3 style="color:${COLORS[node.color].t1}">
        <span class="h3-left">${node.label}</span>
      </h3>
      ${node.breakdown ? `<div class="ex-b" style="margin:8px 0">${formatBreakdown(node.breakdown)}</div>` : ''}
      <div class="mean">${formatMeaning(node.sub)}</div>
    `;
  } else if (node.type === 'item'){
    const exList = (node.children || []).map(c => `
      <div class="ex-item">
        <div class="ex-w">${c.label}</div>
        ${c.breakdown ? `<div class="ex-b">${formatBreakdown(c.breakdown)}</div>` : ''}
        <div class="ex-m">${formatMeaning(c.sub)}</div>
      </div>
    `).join('');

    let srcBadge = '';
    if (node.src){
      const isG = node.src === 'greek';
      srcBadge = `<span class="src-badge ${isG?'greek':'latin'}">${isG?'希腊语源':'拉丁语源'}</span>`;
    }

    html += `
      <div class="dtag" style="background:${cc.bg};color:${cc.color}">${CAT_LABEL[node.id.split('-')[1]] || '词根'}</div>
      <h3 style="color:${COLORS[node.color].t1}">
        <span class="h3-left">${node.label}${srcBadge}</span>
        ${node.pron ? `<span class="h3-pron">${node.pron}</span>` : ''}
      </h3>
      <div class="mean">${node.sub}</div>
    `;

    const mState = mastery.get(node.id) || 0;
    html += `
      <div class="mastery-btns">
        <button class="mbtn ${mState===1?'active-1':''}" data-m="1">学习中</button>
        <button class="mbtn ${mState===2?'active-2':''}" data-m="2">已掌握</button>
      </div>
    `;

    if (node.origin){
      html += `
        <div class="origin-box">
          <div class="origin-label">词源与含义演变</div>
          <div class="origin-text">${node.origin}</div>
        </div>
      `;
    }

    const cmp = findCompare(node.label);
    if (cmp){
      html += `
        <div class="compare-box">
          <div class="compare-label">${cmp.title}</div>
          <div class="compare-text">${cmp.text}</div>
        </div>
      `;
    }

    html += `<div class="ex-list">${exList}</div>`;
  } else {
    html += `
      <div class="dtag" style="background:${cc.bg};color:${cc.color}">${CAT_LABEL[node.id.replace('cat-','')] || '分类'}</div>
      <h3 style="color:${COLORS[node.color].t1}">
        <span class="h3-left">${node.label}</span>
      </h3>
      <div class="mean">${node.sub}</div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;">点击节点展开查看下级内容</div>
    `;
  }

  html += `</div>`;
  detailEl.innerHTML = html;
  detailEl.classList.add('show');

  const closeBtn = document.getElementById('closeD');
  if (closeBtn) closeBtn.addEventListener('click', ev => { ev.stopPropagation(); hideDetail(); });

  detailEl.querySelectorAll('.mbtn').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      const m = +btn.dataset.m;
      const cur = mastery.get(node.id) || 0;
      if (cur === m){
        mastery.delete(node.id);
      } else {
        mastery.set(node.id, m);
      }
      saveMastery();
      render();
      showDetail(node);
    });
  });
}

function hideDetail(){
  detailEl.classList.remove('show');
  selectedId = null;
}

/* ============================================================
   搜索
   ============================================================ */
let searchTimer = null;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    query = searchEl.value.trim();
    if (query) expandAncestors(TREE, query.toLowerCase());
    render();
    if (query) requestAnimationFrame(() => fitView());
  }, 180);
});

function expandAncestors(node, q){
  const selfHay = (node.label + ' ' + (node.sub || '') + ' ' + (node.origin || '') + ' ' + (node.pron || '') + ' ' + (node.breakdown || '')).toLowerCase();
  let hit = selfHay.includes(q);
  if (node.children){
    let childHit = false;
    node.children.forEach(c => { if (expandAncestors(c, q)) childHit = true; });
    if (childHit){ node.collapsed = false; hit = true; }
  }
  return hit;
}

/* ============================================================
   随机自测
   ============================================================ */
const ALL_ITEMS = [];
(function collectItems(node){
  if (node.type === 'item' && node.children && node.children.length >= 3){
    ALL_ITEMS.push(node);
  }
  if (node.children) node.children.forEach(collectItems);
})(TREE);

let quiz = { queue:[], idx:0, score:0, total:0, mode:'' };
const quizModal = document.getElementById('quizModal');
const quizBody  = document.getElementById('quizBody');
const progEl    = document.getElementById('quizProgress');

function shuffle(a){
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(){
  const pool = ALL_ITEMS.filter(n => (mastery.get(n.id) || 0) < 2);
  const source = pool.length >= 5 ? pool : ALL_ITEMS;
  const shuffled = shuffle([...source]);
  quiz.total = Math.min(10, shuffled.length);
  quiz.queue = shuffled.slice(0, quiz.total);
  quiz.idx = 0;
  quiz.score = 0;
  quizModal.classList.add('show');
  showQuestion();
}

function showQuestion(){
  if (quiz.idx >= quiz.total) return showResult();

  const item = quiz.queue[quiz.idx];
  const mode = Math.random() < 0.5 ? 'root2mean' : 'ex2root';
  quiz.mode = mode;

  if (mode === 'root2mean'){
    const others = shuffle(ALL_ITEMS.filter(x => x.sub !== item.sub && x.id !== item.id)).slice(0,3);
    const opts = shuffle([item.sub, ...others.map(x => x.sub)]);
    progEl.textContent = `第 ${quiz.idx+1} / ${quiz.total} 题 · 得分 ${quiz.score}`;
    quizBody.innerHTML = `
      <div class="q-label">这个${CAT_LABEL[item.id.split('-')[1]] || '词根'}的底层含义是？</div>
      <div class="q-root">${item.label}</div>
      ${item.pron ? `<div class="q-pron">${item.pron}</div>` : ''}
      <div class="q-hint">先回忆，再选择</div>
      <div class="options">
        ${opts.map((o,i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
    `;
    bindOptions(opts, item.sub, item);
  } else {
    const exNode = item.children[Math.floor(Math.random() * item.children.length)];
    const others = shuffle(ALL_ITEMS.filter(x => x.label !== item.label && x.id !== item.id)).slice(0,3);
    const opts = shuffle([item.label, ...others.map(x => x.label)]);
    progEl.textContent = `第 ${quiz.idx+1} / ${quiz.total} 题 · 得分 ${quiz.score}`;
    quizBody.innerHTML = `
      <div class="q-label">这个例词对应的词根是？</div>
      <div class="q-root">${exNode.label}</div>
      ${exNode.breakdown ? `<div class="q-pron">${exNode.breakdown}</div>` : ''}
      <div class="q-hint">${exNode.sub}</div>
      <div class="options">
        ${opts.map((o,i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
      </div>
      <div class="fb" id="fb"></div>
    `;
    bindOptions(opts, item.label, item);
  }
}

function bindOptions(opts, correct, item){
  quizBody.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      const chosen = opts[+btn.dataset.i];
      const isCorrect = chosen === correct;
      if (isCorrect) quiz.score++;

      quizBody.querySelectorAll('.opt').forEach(b => {
        const val = opts[+b.dataset.i];
        b.disabled = true;
        if (val === correct) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
      });

      progEl.textContent = `第 ${quiz.idx+1} / ${quiz.total} 题 · 得分 ${quiz.score}`;
      const fb = document.getElementById('fb');
      fb.innerHTML = (isCorrect
        ? '<span style="color:#3ddc84">✅ 正确</span>'
        : `<span style="color:#ff5f6d">❌ 正确答案：${correct}</span>`)
        + `<button class="next-btn" id="nextQ">${quiz.idx+1>=quiz.total?'查看结果':'下一题 →'}</button>`;

      document.getElementById('nextQ').addEventListener('click', () => {
        quiz.idx++;
        showQuestion();
      });
    });
  });
}

function showResult(){
  const pct = Math.round(quiz.score / quiz.total * 100);
  progEl.textContent = '完成';
  quizBody.innerHTML = `
    <div class="result">
      <div class="big">${quiz.score} / ${quiz.total}</div>
      <div class="pct">正确率 ${pct}%</div>
      <p>${pct>=80 ? '👏 底层逻辑已经内化，继续保持' : '别急着背中文，回头把卡片再点开看一遍 🧩'}</p>
      <button class="next-btn" id="again">再来一轮</button>
      <button class="ghost-btn" id="quit">关闭</button>
    </div>
  `;
  document.getElementById('again').addEventListener('click', startQuiz);
  document.getElementById('quit').addEventListener('click', () => quizModal.classList.remove('show'));
}

document.getElementById('quizBtn').addEventListener('click', startQuiz);
document.getElementById('closeQuiz').addEventListener('click', () => quizModal.classList.remove('show'));
quizModal.addEventListener('click', e => { if (e.target === quizModal) quizModal.classList.remove('show'); });

/* ============================================================
   按钮
   ============================================================ */
document.getElementById('fitBtn').addEventListener('click', fitView);
document.getElementById('zoomFit').addEventListener('click', fitView);
document.getElementById('zoomIn').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1.2);
});
document.getElementById('zoomOut').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, 1/1.2);
});

document.getElementById('expandBtn').addEventListener('click', () => {
  (function walk(n){
    if (n.children && n.children.length){ n.collapsed = false; n.children.forEach(walk); }
  })(TREE);
  render();
  setTimeout(fitView, 60);
});

document.getElementById('collapseBtn').addEventListener('click', () => {
  TREE.collapsed = false;
  TREE.children.forEach(c => { c.collapsed = true; collapseDescendants(c); });
  render();
  setTimeout(fitView, 60);
});

/* ============================================================
   窗口与键盘
   ============================================================ */
let rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(fitView, 150);
});

document.addEventListener('keydown', e => {
  if (e.target === searchEl) return;
  const r = svg.getBoundingClientRect();
  if (e.key === '+' || e.key === '=') zoomAt(r.width/2, r.height/2, 1.15);
  if (e.key === '-' || e.key === '_') zoomAt(r.width/2, r.height/2, 1/1.15);
  if (e.key === '0' || e.key === 'f' || e.key === 'F') fitView();
  if (e.key === '/'){ e.preventDefault(); searchEl.focus(); }
  if (e.key === 'Escape') quizModal.classList.remove('show');
});

/* ============================================================
   启动
   ============================================================ */
render();
requestAnimationFrame(() => requestAnimationFrame(fitView));
  </script>
</body>
